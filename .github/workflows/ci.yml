name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run check
      - run: bash -n deploy.sh
      - run: DISCORD_BOT_ENV_FILE=.env.example docker compose --env-file .env.example -f compose.yml config --quiet
      - run: docker build -t sndbox-discord-bot:ci .
      - name: Verify container metadata and runtime syntax
        shell: bash
        run: |
          test "$(docker image inspect sndbox-discord-bot:ci --format '{{.Config.User}}')" = "node"
          docker image inspect sndbox-discord-bot:ci --format '{{json .Config.Healthcheck}}' | grep -q HEALTH_FILE
          docker run --rm --entrypoint node sndbox-discord-bot:ci --check src/index.js
